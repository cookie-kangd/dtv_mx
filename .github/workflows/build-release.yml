name: Build Android APK & Release

on:
  # 只由 v* 标签触发构建发版。
  # 注意不要再加 branches 触发：发版流程是「同一批改动既推 main 提交、又推 v* 标签」，
  # 若两个都开，main 与 tag 会各触发一次 CI，其中 main 那次完整构建完 APK 却
  # 被 Create Release 的 tag 条件拦住直接丢弃，纯浪费约 5 分钟构建时间。
  # 无标签的 main 提交需要手动构建时，用 workflow_dispatch 手动触发。
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      # 应用版本号（需与 androidApp/build.gradle.kts 的 versionName 保持一致）
      APP_VERSION: "0.2.8"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Write signing config (keystore decoded from GitHub Secrets)
        # 签名密钥已迁移到仓库 Secrets（SIGNING_KEYSTORE_BASE64 等），不再提交进仓库。
        #
        # ⚠️ 关键：这里解码出的必须是**同一把**密钥（即原先提交在
        # androidApp/signing/release.keystore 的那把）。Android 的 OTA 覆盖安装校验的是
        # 签名证书，只要密钥不变，已安装的旧版本就能正常升级；
        # 一旦换成新密钥，用户升级时会报签名冲突（INSTALL_FAILED_UPDATE_INCOMPATIBLE）。
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          mkdir -p androidApp/signing
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > androidApp/signing/release.keystore
          printf 'storeFile=signing/release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$SIGNING_STORE_PASSWORD" "$SIGNING_KEY_ALIAS" "$SIGNING_KEY_PASSWORD" \
            > androidApp/keystore.properties
          # 校验解码产物确实是合法 keystore，避免密钥损坏导致构建出无法升级的包
          keytool -list -keystore androidApp/signing/release.keystore \
            -storepass "$SIGNING_STORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS"

      - name: Build release APK
        # Skip the Aliyun mirror in CI (unstable / 502) and use Google/Maven Central directly.
        env:
          DTV_NO_ALIYUN_MIRROR: "true"
        run: ./gradlew :androidApp:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        id: apk
        run: |
          APK=$(find androidApp/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::未找到构建产物 APK"
            exit 1
          fi
          # 发布产物统一命名为 dtv-X-<版本号>.apk（应用内更新会按 .apk 资源匹配）
          ASSET_NAME="dtv-mx-${APP_VERSION}.apk"
          mkdir -p out
          cp "$APK" "out/$ASSET_NAME"
          echo "apk_path=out/$ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: dtv-mx-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Create Release
        # 只在推送 v* 标签时发版。此前没有这个限制，推 main 也会走到这里，
        # 把同名 release 删掉重建（甚至与标签构建并发抢同一个 release）。
        if: ${{ startsWith(github.ref, 'refs/tags/v') && steps.apk.outputs.apk_path != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$APP_VERSION"
          TAG="v${VERSION}"
          # 同名 release 已存在时先删除
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "existing release $TAG found, replacing it"
            gh release delete "$TAG" --yes
          fi
          # release delete 不会删除同名 tag；远程与本地残留都要清掉，
          # 否则 gh 会因为"本地已有同名 tag 但未推送"而拒绝创建
          git push --delete origin "refs/tags/$TAG" || echo "remote tag $TAG absent, skip"
          git tag -d "$TAG" || echo "local tag $TAG absent, skip"
          # 只截取与当前版本对应的 CHANGELOG 小节作为 Release 说明，
          # 内容直接写「新增了什么功能、修复了什么问题」，不重复罗列历史版本的内容。
          {
            echo "## dtv_mx 更新说明"
            echo ""
            # sub(/\r$/, "") 兜住 CRLF 换行的 CHANGELOG，
            # 否则 "## v0.1.9\r" 与 "## v0.1.9" 比较不相等，会抽出空说明。
            awk -v ver="v${VERSION}" '
              { sub(/\r$/, "") }
              /^## / {
                if ($0 == "## " ver) { p = 1; next }
                else { p = 0 }
              }
              p { print }
            ' CHANGELOG.md
          } > release_body.md
          echo "----- release notes preview -----"
          cat release_body.md
          # 说明为空说明 CHANGELOG 里没有对应版本小节，直接失败以免发出空说明的 release
          if [ "$(grep -cve '^[[:space:]]*$' release_body.md)" -le 1 ]; then
            echo "::error::CHANGELOG.md 中未找到 '## v${VERSION}' 小节，Release 说明为空"
            exit 1
          fi
          gh release create "$TAG" \
            "${{ steps.apk.outputs.apk_path }}" \
            --target "${{ github.sha }}" \
            --title "dtv_mx v${VERSION}" \
            --notes-file release_body.md
